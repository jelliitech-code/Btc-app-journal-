const mapK=a=>a.map(x=>({t:x[0]/1e3,o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5],d:x[9]!==undefined?2*x[9]-x[5]:null}));

 try{let o=[],e='';while(o.length<n){const a=await J(`${F}/klines?symbol=BTCUSDT&interval=${tf}&limit=${m}${e}`);if(!a.length)break;o=a.concat(o);e='&endTime='+(a[0][0]-1);if(a.length<m)break}return mapK(o.slice(-n))}
 catch(e){const r=await J(`${BY}/kline?category=linear&symbol=BTCUSDT&interval=${TFM[tf]}&limit=${Math.min(n,1000)}`);return mapK(r.result.list.reverse())}}
async function getD(){const q=a=>a.map(x=>[+x[1],+x[2],+x[3],+x[4]]);
 try{return q(await J(F+'/klines?symbol=BTCUSDT&interval=1d&limit=3'))}catch(e){return q((await J(BY+'/kline?category=linear&symbol=BTCUSDT&interval=D&limit=3')).result.list.reverse())}}
async function load(){if(D.tf==tf&&D.K.length>50){(await getK(10)).forEach(k=>{const l=D.K.at(-1);k.t==l.t?D.K[D.K.length-1]=k:k.t>l.t&&D.K.push(k)})}
 else{D.K=await getK(Math.round(7*1440/TFM[tf])+260);D.tf=tf;D.fresh=1}D.d=await getD()}
/* ===== MATH ===== */
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((x,i)=>e=i?x*k+e*(1-k):x)};
const rsi=c=>{let g=0,l=0;return c.map((x,i)=>{if(!i)return 50;const d=x-c[i-1],G=d>0?d:0,L=d<0?-d:0;if(i<=14){g+=G/14;l+=L/14}else{g=(g*13+G)/14;l=(l*13+L)/14}return l?100-100/(1+g/l):100})};
const atr=K=>{let a=0;return K.map((k,i)=>{const p=K[i-1],t=p?Math.max(k.h-k.l,Math.abs(k.h-p.c),Math.abs(k.l-p.c)):k.h-k.l;a=i<14?(a*i+t)/(i+1):(a*13+t)/14;return a})};
function calc(K){const c=K.map(k=>k.c);let pv=0,vv=0,d0=-1,s=0;
 const X={K,A:atr(K),E21:ema(c,21),E50:ema(c,50),E200:ema(c,200),R:rsi(c),P:[]};
 X.V=K.map(k=>{const d=Math.floor(k.t/86400);if(d!=d0){d0=d;pv=vv=0}pv+=(k.h+k.l+k.c)/3*k.v;vv+=k.v;return pv/vv});
 X.VS=K.map((k,i)=>{s+=k.v;if(i>=20)s-=K[i-20].v;return s/Math.min(i+1,20)});
 for(let i=3;i<K.length-3;i++){const w=K.slice(i-3,i+4);if(K[i].h==Math.max(...w.map(x=>x.h)))X.P.push({i,p:K[i].h,y:'H',c:i+3});if(K[i].l==Math.min(...w.map(x=>x.l)))X.P.push({i,p:K[i].l,y:'L',c:i+3})}
 X.P.sort((a,b)=>a.c-b.c);X.OB=obs(X);return X}
function obs({K,A}){const O=[];for(let i=5;i<K.length;i++){const k=K[i],up=k.c>k.o;if(Math.abs(k.c-k.o)<1.3*A[i-1])continue;const w=K.slice(i-3,i);
 if(up?k.c<=Math.max(...w.map(x=>x.h)):k.c>=Math.min(...w.map(x=>x.l)))continue;
 for(let j=i-1;j>=i-6;j--){const q=K[j];if(up?q.c<q.o:q.c>q.o){const o={d:up?1:-1,lo:q.l,hi:q.h,i,t:q.t};o.m=K.findIndex((x,z)=>z>i&&(up?x.c<o.lo:x.c>o.hi));O.push(o);break}}}return O}
/* market structure: confirmed 3/3 fractals, HH/HL/LH/LL, BOS / CHoCH (no look-ahead: a swing is only known 3 bars later) */
function walk(X,cb){const{K,P}=X;let p=0,H,PH,L,PL,bt=0,tr=0,ev=[],lab=[];
 for(let i=0;i<K.length;i++){
  while(p<P.length&&P[p].c<=i){const q={...P[p++]};if(q.y=='H'){q.s=H?(q.p>H.p?'HH':'LH'):'H';PH=H;H=q}else{q.s=L?(q.p<L.p?'LL':'HL'):'L';PL=L;L=q}lab.push(q)}
  const k=K[i];
  if(H&&!H.b&&k.c>H.p){H.b=1;ev.push({t:k.t,s:bt<0?'CHoCH ▲':'BOS ▲',p:H.p});bt=1}
  if(L&&!L.b&&k.c<L.p){L.b=1;ev.push({t:k.t,s:bt>0?'CHoCH ▼':'BOS ▼',p:L.p});bt=-1}
  tr=H&&PH&&L&&PL?(H.p>PH.p&&L.p>PL.p?1:H.p<PH.p&&L.p<PL.p?-1:0):0;
  cb&&cb(i,{H,L,tr})}
 return{ev,lab,H,L,tr}}
function srl(X){const a=X.A.at(-1),px=X.K.at(-1).c,g=[];
 X.P.slice(-90).map(q=>q.p).sort((x,y)=>x-y).forEach(p=>{const l=g.at(-1);if(l&&p-l.m<.35*a){l.n++;l.s+=p;l.m=l.s/l.n}else g.push({n:1,s:p,m:p})});
 const L=g.filter(x=>x.n>=2).map(x=>({p:x.m,n:x.n}));
 return{S:L.filter(x=>x.p<px).sort((x,y)=>y.p-x.p).slice(0,3),R:L.filter(x=>x.p>px).sort((x,y)=>x.p-y.p).slice(0,3)}}
function fibo({H,L}){if(!H||!L)return;const g=H.p-L.p,u=L.i<H.i,f=r=>u?H.p-g*r:L.p+g*r;return{u,H,L,lv:[-.618,-.272,0,.236,.382,.5,.618,.786,1].map(r=>({r,p:f(r)}))}}
/* volume profile: POC + 70% value area (volume spread across each candle's range) */
function vp(K){if(K.length<5)return;const lo=Math.min(...K.map(k=>k.l)),hi=Math.max(...K.map(k=>k.h)),n=48,s=(hi-lo)/n||1,b=Array(n).fill(0);
 K.forEach(k=>{const a=Math.max(0,Math.floor((k.l-lo)/s)),z=Math.min(n-1,Math.floor((k.h-lo)/s));for(let j=a;j<=z;j++)b[j]+=k.v/(z-a+1)});
 const p=b.indexOf(Math.max(...b)),t=b.reduce((x,y)=>x+y,0);let l=p,h=p,a=b[p];
 while(a<.7*t&&(l>0||h<n-1)){const dn=l>0?b[l-1]:-1,up=h<n-1?b[h+1]:-1;if(up>=dn){h++;a+=b[h]}else{l--;a+=b[l]}}
 return{poc:lo+(p+.5)*s,vah:lo+(h+1)*s,val:lo+l*s}}
/* ===== JOURNAL ENGINE: fixed rules, no tuning, no look-ahead =====
 Signal = closed candle i. Entry = OPEN of candle i+1. Every gate below must pass (no points, no discretion).
 Common gates: (1) trend side vs EMA200, (2) real taker-flow delta agrees, (3) volume >= 1.1x 20-bar avg, (4) round-trip cost <= 0.25R.
 Setup A "Sweep & Reclaim": wick through last confirmed swing, close back inside, rejection wick >= 50% of range, range >= 0.8 ATR, RSI not stretched.
 Setup B "VWAP Pullback": EMA21/50 + VWAP slope agree, pullback into VWAP/EMA21 value zone, reclaim candle, RSI 40-62.
 Stop = beyond candle extreme +0.25 ATR (0.8-2.0 ATR wide). TP1 = 1R (half, stop to entry), TP2 = 2R. Fees+slippage 0.12% round trip deducted. */
function sig(X,i,S){const{K,A,E21,E50,E200,R,V,VS,OB}=X,k=K[i],n=K[i+1],a=A[i],rg=k.h-k.l||1e-9,vr=k.v/VS[i],{H,L}=S;
 if(!H||!L||!n)return;
 for(const d of[1,-1]){const up=d>0,sw=up?L:H,dl=k.d,wk=up?Math.min(k.o,k.c)-k.l:k.h-Math.max(k.o,k.c),zl=Math.min(V[i],E21[i]),zh=Math.max(V[i],E21[i]);
  if(!(up?k.c>E200[i]:k.c<E200[i])||!(dl==null||(up?dl>0:dl<0))||vr<1.1)continue;
  let st,why;
  if((up?k.l<sw.p&&k.c>sw.p:k.h>sw.p&&k.c<sw.p)&&wk>=.5*rg&&rg>=.8*a&&i-sw.i<150&&(up?R[i]<58:R[i]>42)){st='Sweep & Reclaim';
   why=`Wick ${up?'dipped to':'spiked to'} ${fp(up?k.l:k.h)}, through the confirmed swing ${up?'low':'high'} ${fp(sw.p)}, and the candle closed back ${up?'above':'below'} it at ${fp(k.c)}. Stops resting beyond that level were taken, then price was rejected: ${Math.round(wk/rg*100)}% rejection wick, range ${(rg/a).toFixed(1)}×ATR, RSI ${R[i].toFixed(0)} not stretched.`}
  else if((up?E21[i]>E50[i]&&V[i]>V[i-10]:E21[i]<E50[i]&&V[i]<V[i-10])&&(up?k.l<=zh+.25*a&&k.c>zh&&k.c>k.o&&R[i]>40&&R[i]<62:k.h>=zl-.25*a&&k.c<zl&&k.c<k.o&&R[i]<60&&R[i]>38)){st='VWAP Pullback';
   why=`EMA21 ${up?'>':'<'} EMA50 and session VWAP is sloping ${up?'up':'down'}. Price pulled into the value zone VWAP ${fp(V[i])} / EMA21 ${fp(E21[i])} and closed ${up?'above':'below'} it with a ${up?'green':'red'} candle (RSI ${R[i].toFixed(0)}): the trend is resuming from fair value.`}
  else continue;
  const e=n.o;let sl=up?Math.min(k.l,K[i-1].l)-.25*a:Math.max(k.h,K[i-1].h)+.25*a;if(up?e<=sl:e>=sl)continue;
  let rk=Math.abs(e-sl);if(rk<.8*a){rk=.8*a;sl=e-d*rk}if(rk>2*a)continue;const cr=e*FEE/rk;if(cr>.25)continue;
  const ck=[`Trend side: close ${fp(k.c)} is ${up?'above':'below'} EMA200 ${fp(E200[i])}`,
   dl==null?'Order-flow delta unavailable on the fallback exchange (gate skipped)':`Real taker delta ${dl>0?'+':''}${dl.toFixed(1)} BTC: ${up?'buyers':'sellers'} were the aggressor`,
   `Volume ${vr.toFixed(1)}× the 20-bar average`,`Cost gate: round-trip fees+slippage ${(FEE*100).toFixed(2)}% = ${cr.toFixed(2)}R (limit 0.25R)`];
  return{t:k.t,te:n.t,i,d,st,why,ck,e,sl,tp1:e+d*rk,tp2:e+2*d*rk,a,rk,cr}}}
function sim(K,e){const d=e.d,fin=(g,o,n)=>({g:+g.toFixed(2),r:+(g-e.cr).toFixed(2),o,n});let h=0;
 for(let j=e.i+1;j<K.length;j++){const k=K[j],n=j-e.i,sl=h?e.e:e.sl;
  if(d>0?k.l<=sl:k.h>=sl)return h?fin(.5,'TP1 hit, then stopped at entry',n):fin(-1,'Stop-loss hit',n);
  if(!h&&(d>0?k.h>=e.tp1:k.l<=e.tp1))h=1;
  if(h&&(d>0?k.h>=e.tp2:k.l<=e.tp2))return fin(1.5,'TP1 + TP2 hit',n);
  if(n>=48){const p=d*(k.c-e.e)/e.rk;return fin(h?.5+.5*p:p,'Time exit (48 bars)',n)}}

async function liq(){const o=$('#lq');o.innerHTML='<div class="card">Loading order book…</div>';
