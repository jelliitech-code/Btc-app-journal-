<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const F='https://fapi.binance.com/fapi/v1',BY='https://api.bybit.com/v5/market',TFM={'1m':1,'3m':3,'5m':5,'15m':15,'30m':30,'1h':60};
const J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
const fp=n=>(+n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const ist=(t,o)=>new Date(t*1e3).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',...o});
const tm=t=>ist(t,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const tag=(x,c)=>`<span class="tg ${c}">${x}</span>`,dist=(p,x)=>`${p>x?'+':''}${((p/x-1)*100).toFixed(2)}%`;
let tf='5m',D={K:[],tf:'',d:[]},Z=null,tab='c',T={pd:1,sr:1,fb:0,ob:1,sg:1},PL=[],jr=[];
/* ---------- DATA (Binance Futures, fallback Bybit) ---------- */
const mapK=a=>a.map(x=>({t:x[0]/1e3,o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
async function getK(n){const m=Math.min(n,1500);
 try{let o=[],e='';while(o.length<n){const a=await J(`${F}/klines?symbol=BTCUSDT&interval=${tf}&limit=${m}${e}`);if(!a.length)break;o=a.concat(o);e='&endTime='+(a[0][0]-1);if(a.length<m)break}return mapK(o.slice(-n))}
 catch(e){const r=await J(`${BY}/kline?category=linear&symbol=BTCUSDT&interval=${TFM[tf]}&limit=${Math.min(n,1000)}`);return mapK(r.result.list.reverse())}}
async function getD(){const q=a=>a.map(x=>[+x[1],+x[2],+x[3],+x[4]]);
 try{return q(await J(F+'/klines?symbol=BTCUSDT&interval=1d&limit=3'))}catch(e){return q((await J(BY+'/kline?category=linear&symbol=BTCUSDT&interval=D&limit=3')).result.list.reverse())}}
async function load(){if(D.tf==tf&&D.K.length>20){(await getK(10)).forEach(k=>{const l=D.K.at(-1);k.t==l.t?D.K[D.K.length-1]=k:k.t>l.t&&D.K.push(k)})}
 else{D.K=await getK(Math.round(7*1440/TFM[tf])+150);D.tf=tf;D.fresh=1}D.d=await getD()}
/* ---------- MATH: indicators ---------- */
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((x,i)=>e=i?x*k+e*(1-k):x)};
const rsi=c=>{let g=0,l=0;return c.map((x,i)=>{if(!i)return 50;const d=x-c[i-1],G=d>0?d:0,L=d<0?-d:0;if(i<=14){g+=G/14;l+=L/14}else{g=(g*13+G)/14;l=(l*13+L)/14}return l?100-100/(1+g/l):100})};
const atr=K=>{let a=0;return K.map((k,i)=>{const p=K[i-1],t=p?Math.max(k.h-k.l,Math.abs(k.h-p.c),Math.abs(k.l-p.c)):k.h-k.l;a=i<14?(a*i+t)/(i+1):(a*13+t)/14;return a})};
function calc(K){const c=K.map(k=>k.c);let pv=0,vv=0,d0=-1,s=0;
 const X={K,A:atr(K),E9:ema(c,9),E21:ema(c,21),E50:ema(c,50),R:rsi(c),P:[]};
 X.V=K.map(k=>{const d=Math.floor(k.t/86400);if(d!=d0){d0=d;pv=vv=0}pv+=(k.h+k.l+k.c)/3*k.v;vv+=k.v;return pv/vv});
 X.VS=K.map((k,i)=>{s+=k.v;if(i>=20)s-=K[i-20].v;return s/Math.min(i+1,20)});
 for(let i=3;i<K.length-3;i++){const w=K.slice(i-3,i+4);if(K[i].h==Math.max(...w.map(x=>x.h)))X.P.push({i,p:K[i].h,y:'H',c:i+3});if(K[i].l==Math.min(...w.map(x=>x.l)))X.P.push({i,p:K[i].l,y:'L',c:i+3})}
 X.P.sort((a,b)=>a.c-b.c);X.OB=obs(X);return X}
/* order blocks: last opposite candle before a displacement candle that breaks the prior 3-bar range; mitigated when a close passes through it */
function obs({K,A}){const O=[];for(let i=5;i<K.length;i++){const k=K[i],up=k.c>k.o;if(Math.abs(k.c-k.o)<1.3*A[i-1])continue;const w=K.slice(i-3,i);
 if(up?k.c<=Math.max(...w.map(x=>x.h)):k.c>=Math.min(...w.map(x=>x.l)))continue;
 for(let j=i-1;j>=i-6;j--){const q=K[j];if(up?q.c<q.o:q.c>q.o){const o={d:up?1:-1,lo:q.l,hi:q.h,i,t:q.t};o.m=K.findIndex((x,z)=>z>i&&(up?x.c<o.lo:x.c>o.hi));O.push(o);break}}}return O}
/* market structure walk: confirmed fractal swings (3 left/3 right), HH/HL/LH/LL labels, BOS and CHoCH */
function walk(X,cb){const{K,P}=X;let p=0,H,PH,L,PL,bt=0,tr=0,ev=[],lab=[];
 for(let i=0;i<K.length;i++){
  while(p<P.length&&P[p].c<=i){const q={...P[p++]};if(q.y=='H'){q.s=H?(q.p>H.p?'HH':'LH'):'H';PH=H;H=q}else{q.s=L?(q.p<L.p?'LL':'HL'):'L';PL=L;L=q}lab.push(q)}
  const k=K[i];
  if(H&&!H.b&&k.c>H.p){H.b=1;ev.push({t:k.t,s:bt<0?'CHoCH ▲':'BOS ▲',p:H.p});bt=1}
  if(L&&!L.b&&k.c<L.p){L.b=1;ev.push({t:k.t,s:bt>0?'CHoCH ▼':'BOS ▼',p:L.p});bt=-1}
  tr=H&&PH&&L&&PL?(H.p>PH.p&&L.p>PL.p?1:H.p<PH.p&&L.p<PL.p?-1:0):0;
  cb&&cb(i,{H,L,tr})}
 return{ev,lab,H,L,tr}}
/* S/R = clusters of swing prices within 0.35 ATR; strength = touches */
function srl(X){const a=X.A.at(-1),px=X.K.at(-1).c,g=[];
 X.P.slice(-90).map(q=>q.p).sort((x,y)=>x-y).forEach(p=>{const l=g.at(-1);if(l&&p-l.m<.35*a){l.n++;l.s+=p;l.m=l.s/l.n}else g.push({n:1,s:p,m:p})});
 const L=g.filter(x=>x.n>=2).map(x=>({p:x.m,n:x.n}));
 return{S:L.filter(x=>x.p<px).sort((x,y)=>y.p-x.p).slice(0,3),R:L.filter(x=>x.p>px).sort((x,y)=>x.p-y.p).slice(0,3)}}
/* fib on the latest confirmed swing leg; negative ratios = extensions */
function fibo(W){const{H,L}=W;if(!H||!L)return;const g=H.p-L.p,u=L.i<H.i,f=r=>u?H.p-g*r:L.p+g*r;
 return{u,H,L,lv:[-.618,-.272,0,.236,.382,.5,.618,.786,1].map(r=>({r,p:f(r)}))}}
/* ---------- JOURNAL RULE ENGINE ---------- */
function sig(X,i,S){const{K,A,E9,E21,E50,R,V,VS,OB}=X,k=K[i],a=A[i],rg=k.h-k.l||1e-9,bd=Math.abs(k.c-k.o),vr=k.v/VS[i],{H,L,tr}=S;
 if(!H||!L||a/k.c<.0004)return;
 for(const d of[1,-1]){const up=d>0,sw=up?L:H,br=up?H:L,rs=[];let sc=0,st='';
  const wk=up?Math.min(k.o,k.c)-k.l:k.h-Math.max(k.o,k.c),e21=E21[i];
  const stack=up?E9[i]>e21&&e21>E50[i]:E9[i]<e21&&e21<E50[i];
  if((up?k.l<sw.p&&k.c>sw.p:k.h>sw.p&&k.c<sw.p)&&wk>=.5*rg&&i-sw.i<150){st='Liquidity Sweep';sc=3;
   rs.push(`<b>Liquidity sweep:</b> wick ${up?'dipped to':'spiked to'} ${fp(up?k.l:k.h)}, beyond the last swing ${up?'low':'high'} ${fp(sw.p)}, then closed back ${up?'above':'below'} it at ${fp(k.c)}. Stops resting there were hunted and price was rejected (${Math.round(wk/rg*100)}% rejection wick).`)}
  else if(stack&&(up?k.l<=e21+.3*a&&k.c>e21&&k.c>k.o:k.h>=e21-.3*a&&k.c<e21&&k.c<k.o)){st='Trend Pullback';sc=2;
   rs.push(`<b>Trend pullback:</b> EMA 9/21/50 are stacked ${up?'upward':'downward'}; price tagged EMA21 (${fp(e21)}) and closed ${up?'above':'below'} it with a ${up?'green':'red'} candle, so the trend is resuming.`)}
  else if((up?k.c>br.p&&K[i-1].c<=br.p:k.c<br.p&&K[i-1].c>=br.p)&&bd>=.8*a&&vr>=1.5){st='Momentum Break';sc=2;
   rs.push(`<b>Momentum break:</b> close ${fp(k.c)} beat swing ${up?'high':'low'} ${fp(br.p)} with a ${(bd/a).toFixed(1)}×ATR body and ${vr.toFixed(1)}× average volume, so real participation is behind it.`)}
  else continue;
  const o=OB.find(o=>o.d==d&&o.i<i&&(o.m<0||o.m>i)&&k.c>=o.lo-.5*a&&k.c<=o.hi+.5*a);
  if(up?k.c>V[i]:k.c<V[i]){sc++;rs.push(`Session VWAP ${fp(V[i])}: price is on the ${up?'buy':'sell'} side of it (+1).`)}
  if(up?R[i]>R[i-1]&&R[i]<68:R[i]<R[i-1]&&R[i]>32){sc++;rs.push(`RSI ${R[i].toFixed(0)} is ${up?'rising':'falling'} and not exhausted (+1).`)}
  if(tr==d){sc++;rs.push(`Market structure ${up?'HH-HL':'LH-LL'} agrees with the trade direction (+1).`)}
  if(o){sc++;rs.push(`Price is at an unmitigated ${up?'demand':'supply'} order block ${fp(o.lo)}–${fp(o.hi)} (+1).`)}
  if(vr>=1.2&&st!='Momentum Break'){sc++;rs.push(`Volume ${vr.toFixed(1)}× the 20-bar average (+1).`)}
  if(sc<5)continue;
  rs.push(`Volatility filter: ATR ${fp(a)} = ${(a/k.c*100).toFixed(2)}% of price, enough range to beat fees on a scalp.`);
  let sl=up?Math.min(k.l,K[i-1].l)-.2*a:Math.max(k.h,K[i-1].h)+.2*a,rk=Math.abs(k.c-sl);
  if(rk<.7*a){rk=.7*a;sl=k.c-d*rk}if(rk>2.2*a)continue;
  return{t:k.t,i,d,st,sc,rs,e:k.c,sl,tp1:k.c+d*rk,tp2:k.c+2*d*rk,a,rk}}}
function sim(K,e){const d=e.d;let h=0;for(let j=e.i+1;j<K.length;j++){const k=K[j],n=j-e.i,sl=h?e.e:e.sl;
 if(d>0?k.l<=sl:k.h>=sl)return h?{r:.5,o:'TP1 hit, then stopped at entry',n}:{r:-1,o:'Stop-loss hit',n};
 if(!h&&(d>0?k.h>=e.tp1:k.l<=e.tp1))h=1;
 if(h&&(d>0?k.h>=e.tp2:k.l<=e.tp2))return{r:1.5,o:'TP1 + TP2 hit',n};
 if(n>=48){const p=d*(k.c-e.e)/e.rk;return{r:+(h?.5+.5*p:p).toFixed(2),o:'Time exit (48 bars)',n}}}
 const k=K.at(-1),p=d*(k.c-e.e)/e.rk;return{r:+(h?.5+.5*p:p).toFixed(2),o:'OPEN',n:K.length-1-e.i}}
function save(E){const db=LS('j7')||{},lim=Date.now()/1e3-7*86400,m=db[tf]||{};E.forEach(e=>m[e.t]=e);db[tf]=m;
 for(const g in db)for(const t in db[g])if(+t<lim)delete db[g][t];LS('j7',db);return Object.values(db[tf]).sort((a,b)=>b.t-a.t)}
/* ---------- ANALYSE ---------- */
function analyse(){const X=calc(D.K.slice(0,-1)),E=[];let busy=0;
 const W=walk(X,(i,S)=>{if(i<60||i<busy)return;const e=sig(X,i,S);if(!e)return;e.res=sim(X.K,e);E.push(e);busy=e.res.o=='OPEN'?1e9:i+e.res.n+3});
 const dd=D.d,PD=dd.length>1?dd.at(-2):null,DO=dd.at(-1)[0];
 Z={X,W,sr:srl(X),fb:fibo(W),PD,DO,px:D.K.at(-1).c};jr=save(E)}
/* ---------- UI: chart ---------- */
let ch,cs;function initChart(){ch=LightweightCharts.createChart($('#ch'),{autoSize:true,crosshair:{mode:0},localization:{timeFormatter:t=>tm(t)},timeScale:{timeVisible:true,tickMarkFormatter:t=>ist(t,{hour:'2-digit',minute:'2-digit',hour12:false})}});
 cs=ch.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444',borderVisible:false});thm()}
function thm(){if(!ch)return;const s=getComputedStyle(document.documentElement),bd=s.getPropertyValue('--bd').trim();
 ch.applyOptions({layout:{background:{color:'transparent'},textColor:s.getPropertyValue('--mt').trim()},grid:{vertLines:{color:bd},horzLines:{color:bd}},rightPriceScale:{borderColor:bd},timeScale:{borderColor:bd}})}
const ln=(p,c,t,s=2)=>PL.push(cs.createPriceLine({price:p,color:c,lineWidth:1,lineStyle:s,axisLabelVisible:true,title:t}));
function draw(){const{X,W,sr,fb,PD,DO,px}=Z,K=D.K;cs.setData(K.map(k=>({time:k.t,open:k.o,high:k.h,low:k.l,close:k.c})));
 if(D.fresh){ch.timeScale().setVisibleLogicalRange({from:K.length-130,to:K.length+6});D.fresh=0}
 PL.forEach(l=>cs.removePriceLine(l));PL=[];
 if(T.pd){if(PD){ln(PD[1],'#f59e0b','PDH');ln(PD[2],'#f59e0b','PDL');ln(PD[3],'#a855f7','PDC',3)}ln(DO,'#3b82f6','DO',3)}
 if(T.sr){sr.S.forEach(x=>ln(x.p,'#22c55e','S×'+x.n,0));sr.R.forEach(x=>ln(x.p,'#ef4444','R×'+x.n,0))}
 if(T.fb&&fb)fb.lv.filter(x=>[.382,.5,.618,.786].includes(x.r)).forEach(x=>ln(x.p,'#a855f7','Fib '+x.r))
 if(T.ob)['1','-1'].forEach(d=>X.OB.filter(o=>o.d==d&&o.m<0).slice(-2).forEach(o=>{const c=d>0?'#16a34a':'#dc2626';ln(o.hi,c,'OB'+(d>0?'↑':'↓'),1);ln(o.lo,c,'',1)}));
 cs.setMarkers(T.sg?jr.slice().reverse().filter(e=>e.t>=K[0].t).map(e=>({time:e.t,position:e.d>0?'belowBar':'aboveBar',color:e.d>0?'#22c55e':'#ef4444',shape:e.d>0?'arrowUp':'arrowDown',text:e.d>0?'CALL':'PUT'})):[]);
 const o=DO,b=PD?`<div class="lv"><span>PDH</span><b>${fp(PD[1])}</b><small>${dist(PD[1],px)}</small></div><div class="lv"><span>PDL</span><b>${fp(PD[2])}</b><small>${dist(PD[2],px)}</small></div><div class="lv"><span>PDC / PDO</span><b>${fp(PD[3])} / ${fp(PD[0])}</b><small>${dist(PD[3],px)}</small></div>`:'';
 $('#kl').innerHTML=`<h3>Key levels (day opens 05:30 IST)</h3>${b}<div class="lv"><span>Today's open</span><b>${fp(o)}</b><small>${dist(o,px)}</small></div><div class="lv"><span>Session VWAP</span><b>${fp(X.V.at(-1))}</b><small>${dist(X.V.at(-1),px)}</small></div>`;

 const row=(n,p,x)=>`<div class="lv"><span>${n}</span><b>${fp(p)}</b><small>${x}</small></div>`;

 <div class="card"><h3>Fibonacci · ${fb?(fb.u?'up-leg retrace':'down-leg retrace'):''}</h3>${fb?`<small>Leg ${fp(fb.L.p)} ↔ ${fp(fb.H.p)}. 0.618–0.786 = optimal trade entry zone; negative = extension targets.</small>`+fb.lv.map(x=>row((x.r==.618?'⭐ ':'')+x.r,x.p,dist(x.p,px))).join(''):'<small>waiting for swings</small>'}</div>
 <div class="card"><h3>Order blocks (unmitigated)</h3>${act.map(o=>`<div class="lv"><span>${tag(o.d>0?'Demand':'Supply',o.d>0?'g':'r')}</span><b>${fp(o.lo)} – ${fp(o.hi)}</b><small>${tm(o.t)}</small></div>`).join('')||'<small>none</small>'}</div>`}
/* ---------- UI: liquidity ---------- */
async function liq(){const o=$('#lq');o.innerHTML='<div class="card">Loading order book…</div>';
 try{let b,a,tr=[];try{const[d,t]=await Promise.all([J(F+'/depth?symbol=BTCUSDT&limit=1000'),J(F+'/aggTrades?symbol=BTCUSDT&limit=1000')]);b=d.bids;a=d.asks;tr=t}
  catch(e){const d=(await J(BY+'/orderbook?category=linear&symbol=BTCUSDT&limit=200')).result;b=d.b;a=d.a}
  const bk=x=>{const m={};x.forEach(([p,q])=>{const k=Math.round(p/5)*5;m[k]=(m[k]||0)+ +q});return m},B=bk(b),A=bk(a),bb=+b[0][0],ba=+a[0][0],sum=m=>Object.values(m).reduce((x,y)=>x+y,0);
  const st=m=>{const v=Object.values(m),u=sum(m)/(v.length||1),s=Math.sqrt(v.reduce((x,y)=>x+(y-u)**2,0)/(v.length||1));return{u,s}};
  const wall=m=>{const{u,s}=st(m);return Object.entries(m).filter(([k,q])=>q>u+2.5*s).sort((x,y)=>y[1]-x[1]).slice(0,4)};
  const sb=sum(B),sa=sum(A),im=(sb-sa)/(sb+sa),bv={},sv={};
  tr.forEach(t=>{const k=Math.round(t.p/5)*5,m=t.m?sv:bv;m[k]=(m[k]||0)+ +t.q});
  const ice=(v,vis,ok,side)=>{const{u,s}=st(v),th=Math.max(1.5,u+1.5*s);return Object.entries(v).filter(([k,q])=>ok(+k)&&q>=th&&q>2*(vis[k]||0)).map(([k,q])=>({k:+k,q,vis:vis[k]||0,side}))};
  const ic=ice(bv,A,k=>k>=ba-5,'Hidden SELL (iceberg ask)').concat(ice(sv,B,k=>k<=bb+5,'Hidden BUY (iceberg bid)')).sort((x,y)=>y.q-x.q).slice(0,5);
  const L=(m,c,n)=>wall(m).map(([k,q])=>`<div class="lv"><span>${tag(n,c)}</span><b>${fp(k)}</b><small>${q.toFixed(1)} BTC</small></div>`).join('')||'<small>no outsized wall</small>';
  const{sr,PD}=Z,pool=[...sr.R.map(x=>[x.p,'Buy-side liquidity (stops above equal highs)','r',x.n]),...sr.S.map(x=>[x.p,'Sell-side liquidity (stops below equal lows)','g',x.n])];
  if(PD)pool.push([PD[1],'PDH · stops above prev-day high','r','D'],[PD[2],'PDL · stops below prev-day low','g','D']);
  o.innerHTML=`<div class="card"><h3>Book imbalance</h3><p style="font-size:26px;font-weight:700" class="${im>0?'g':'r'}">${(im*100).toFixed(1)}%</p><small>Bids ${sb.toFixed(0)} BTC vs asks ${sa.toFixed(0)} BTC in the visible book (${(Math.abs(ba-bb))<50?'±'+(Math.abs(b.at(-1)[0]-bb)/bb*100).toFixed(2)+'% deep':''}). ${Math.abs(im)<.1?'Balanced.':im>0?'Bid-heavy: passive buyers dominate.':'Ask-heavy: passive sellers dominate.'}</small></div>
  <div class="card"><h3>Liquidity walls (visible)</h3>${L(A,'r','Ask wall')}${L(B,'g','Bid wall')}<small>Mid ${fp((bb+ba)/2)}. Walls are size &gt; mean + 2.5σ per $5 bucket.</small></div>
  <div class="card"><h3>Iceberg / hidden order suspects</h3>${tr.length?(ic.map(x=>`<div class="lv"><span>${tag(x.side,x.side[7]=='S'?'r':'g')}</span><b>${fp(x.k)}</b><small>traded ${x.q.toFixed(1)} vs ${x.vis.toFixed(1)} visible</small></div>`).join('')||'<small>No absorption in the last 1000 trades.</small>'):'<small>Trade feed unavailable on fallback exchange.</small>'}</div>
  <div class="card"><h3>Liquidity pools (stop clusters)</h3>${pool.sort((x,y)=>y[0]-x[0]).map(x=>`<div class="lv"><span>${tag(x[3]=='D'?'D':'×'+x[3],x[2])} ${x[1]}</span><b>${fp(x[0])}</b><small>${dist(x[0],Z.px)}</small></div>`).join('')}</div>`
 }catch(e){o.innerHTML='<div class="card r">Order book fetch failed. Check internet/VPN and press refresh.</div>'}}

function rJ(){const C=jr.filter(e=>e.res.o!='OPEN'),net=C.reduce((s,e)=>s+e.res.r,0),w=C.filter(e=>e.res.r>0).length,gp=C.filter(e=>e.res.r>0).reduce((s,e)=>s+e.res.r,0),gl=-C.filter(e=>e.res.r<0).reduce((s,e)=>s+e.res.r,0),last=Z.X.K.at(-1).t;
 $('#jt').textContent=tf;
 $('#js').innerHTML=[['Trades',jr.length,''],['Win rate',C.length?Math.round(w/C.length*100)+'%':'–',''],['Net R',(net>0?'+':'')+net.toFixed(2),net>=0?'g':'r'],['Profit factor',gl?(gp/gl).toFixed(2):gp?'∞':'–',''],['Open',jr.length-C.length,'a']].map(x=>`<div><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join('');
 let day='',h='';jr.forEach(e=>{const d=ist(e.t,{day:'2-digit',month:'short',weekday:'short'});if(d!=day){day=d;h+=`<div class="dh">${d}</div>`}
  const r=e.res.r;h+=`<div class="row jr" onclick="mo(${e.t})"><small>${ist(e.t,{hour:'2-digit',minute:'2-digit',hour12:false})}</small>${tag(e.d>0?'CALL ▲':'PUT ▼',e.d>0?'g':'r')}<span class="n">${e.st} <small>score ${e.sc}</small>${e.t==last?tag('NEW','a'):''}<br><small>E ${fp(e.e)} · SL ${fp(e.sl)} · TP ${fp(e.tp1)} / ${fp(e.tp2)}</small></span><b class="${e.res.o=='OPEN'?'a':r>0?'g':r<0?'r':''}">${e.res.o=='OPEN'?'OPEN ':''}${r>0?'+':''}${r}R</b></div>`});
 $('#jl').innerHTML=h||`<small>No qualifying scalp setups on ${tf} in the last 7 days. The engine only trades when confluence score ≥ 5.</small>`}
function mo(t){const e=jr.find(x=>x.t==t);if(!e)return;const up=e.d>0,r=e.res,usd=Math.max(1,+$('#rk').value||10);
 $('#mc').innerHTML=`<h2>${tag(up?'CALL (LONG)':'PUT (SHORT)',up?'g':'r')} ${e.st}</h2><p class="mt">${tm(e.t)} IST · ${tf} candle close · confluence ${e.sc}/8</p>
 <h4>Why this entry</h4><ul>${e.rs.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h4>Trade plan</h4><div class="g4"><div>Entry<b>${fp(e.e)}</b></div><div>Stop<b class="r">${fp(e.sl)}</b></div><div>TP1 · 1R<b class="g">${fp(e.tp1)}</b></div><div>TP2 · 2R<b class="g">${fp(e.tp2)}</b></div></div>
 <ul style="margin-top:8px"><li><b>Why this stop:</b> beyond the signal-candle extreme plus 0.2×ATR (${fp(e.a)}); distance ${fp(e.rk)} pts = ${(e.rk/e.a).toFixed(2)}×ATR. If a candle trades through it, the idea is invalid.</li>
 <li><b>Why these targets:</b> TP1 at 1R closes half and moves the stop to entry (risk-free); TP2 at 2R closes the rest. Stops wider than 2.2×ATR are skipped as poor value.</li>
 <li><b>Sizing:</b> risking $${usd} ≈ ${(usd/e.rk).toFixed(3)} BTC (a linear USDT perp moves $1 per point per BTC). Check leverage, margin and taker fees yourself.</li></ul>
 <h4>Outcome</h4><p>${tag(r.o,r.o=='OPEN'?'a':r.r>0?'g':'r')} ${r.r>0?'+':''}${r.r}R after ${r.n} bars (${r.n*TFM[tf]} min). Same-candle stop and target is counted as a stop (conservative).</p>
 <small>Rule-based maths only. Entries are decided on closed candles; past results do not guarantee future results and this is not financial advice.</small>`;md.hidden=0}
